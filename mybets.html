<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bets — AfterLight Market</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.page { max-width: 1100px; margin: 40px auto 72px; padding: 0 24px; position: relative; z-index: 1; }
.ph-eyebrow { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; font-weight: 500; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 32px 0; }
.scard { background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--r2); padding: 20px 24px; }
.sc-n { font-size: 28px; font-weight: 700; font-family: 'Outfit', sans-serif; }
.sc-l { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .12em; margin-top: 4px; font-weight: 500; }

.tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 12px; padding: 4px; width: fit-content; flex-wrap: wrap; }
.tab { padding: 7px 20px; border-radius: 9px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: var(--text2); font-family: 'Outfit', sans-serif; transition: all .15s; display: flex; align-items: center; gap: 6px; }
.tab.on { background: var(--gold-glass); color: var(--gold); }
.tab-count { font-size: 11px; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 2px 7px; }

.bet-list { display: flex; flex-direction: column; gap: 12px; }
.bet-row { background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--r2); padding: 18px 20px; display: flex; align-items: center; gap: 16px; text-decoration: none; color: inherit; transition: all 0.2s; }
.bet-row:hover { border-color: rgba(240,168,48,.3); transform: translateX(4px); }

.br-status { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.br-status.active { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.br-status.won { background: var(--green); box-shadow: 0 0 10px var(--green); }
.br-status.lost { background: var(--red); }

.br-info { flex: 1; min-width: 0; }
.br-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.br-meta { display: flex; align-items: center; gap: 12px; }
.br-outcome { font-size: 12px; color: var(--text2); }
.br-outcome strong { color: var(--text); }
.br-date { font-size: 11px; color: var(--text3); }

.br-amounts { text-align: right; flex-shrink: 0; }
.br-amt { font-size: 16px; font-weight: 700; color: var(--text); display: block; margin-bottom: 3px; }
.br-pot { font-size: 12px; color: var(--text3); }
.br-pot.green { color: var(--green); }
.br-pot.red { color: var(--red); }

.br-badge { flex-shrink: 0; margin-left: 10px; }
.badge { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 6px; letter-spacing: .04em; }
.badge.active { background: var(--gold-glass); color: var(--gold); border: 1px solid var(--gold-border); }
.badge.won { background: var(--green-bg); color: var(--green); border: 1px solid rgba(52,199,122,.25); }
.badge.lost { background: var(--red-bg); color: var(--red); border: 1px solid rgba(240,80,80,.25); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text3); background: var(--glass); border-radius: var(--r2); border: 1px dashed var(--glass-border); }
.empty-ico { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="page-wrap">
<header>
  <div class="header-inner">
    <a href="index.html" class="logo"><div class="logo-mark">A</div><span class="logo-text">AFTERLIGHT</span></a>
    <nav><a href="index.html">Market</a><a href="mybets.html" class="active">My Bets</a><a href="leaderboard.html">Leaders</a></nav>
    <div class="hdr-right">
      <div class="bal" id="bal-pill">
        <div class="bal-coin">₡</div><span id="bal-num">0</span>
      </div>
      <div id="user-controls"></div> 
    </div>
  </div>
</header>

<div class="page">
  <div style="margin-bottom: 32px;">
    <div class="ph-eyebrow">Shadow_UA · Account</div>
    <h1 style="font-size:36px;font-weight:700;letter-spacing:-0.02em;">My Bets</h1>
  </div>

  <div class="summary">
    <div class="scard"><div class="sc-n" style="color:var(--gold)" id="s-total">₡0</div><div class="sc-l">Total staked</div></div>
    <div class="scard"><div class="sc-n" style="color:var(--green)" id="s-won-val">₡0</div><div class="sc-l">Net profit</div></div>
    <div class="scard"><div class="sc-n" style="color:#70b0e8" id="s-open">0</div><div class="sc-l">Active bets</div></div>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="showTab('all',this)">All <span class="tab-count" id="tc-all">0</span></button>
    <button class="tab" onclick="showTab('active',this)">Active <span class="tab-count" id="tc-act">0</span></button>
    <button class="tab" onclick="showTab('won',this)">Won <span class="tab-count" id="tc-won">0</span></button>
    <button class="tab" onclick="showTab('lost',this)">Lost <span class="tab-count" id="tc-lst">0</span></button>
  </div>

  <div class="bet-list" id="bet-list"></div>
</div>
<footer><p>© 2026 AfterLight Server</p></footer>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
let allBets = [];

async function loadMyBets() {

  const uid = await SHARED.getCurrentUser();
  
  if(!uid) {
    document.getElementById('bet-list').innerHTML = `
      <div class="empty-state">
        <div class="empty-ico">🔒</div>
        <h3>Access restricted</h3>
        <p>Log in to your account to view bet history</p>
        <button onclick="window.location.href='index.html'" style="margin-top:20px; background:var(--gold); color:#000; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:600;">To home (Login)</button>
      </div>
    `;
    return;
  }

  const balance = await SHARED.getBalance();
  allBets = await SHARED.getBets(); 
  
  const balEl = document.getElementById('bal-num');
  if(balEl) balEl.textContent = balance.toLocaleString();

  const totalStaked = allBets.reduce((sum, b) => sum + b.amount, 0);
  const activeBets = allBets.filter(b => b.status === 'active');
  const wonBets = allBets.filter(b => b.status === 'won');
  
  const netProfit = wonBets.reduce((sum, b) => sum + (Math.round(b.amount * (100/b.pct)) - b.amount), 0);

  if(document.getElementById('s-total')) document.getElementById('s-total').textContent = '₡' + totalStaked.toLocaleString();
  if(document.getElementById('s-won-val')) document.getElementById('s-won-val').textContent = '₡' + netProfit.toLocaleString();
  if(document.getElementById('s-open')) document.getElementById('s-open').textContent = activeBets.length;

  if(document.getElementById('tc-all')) document.getElementById('tc-all').textContent = allBets.length;
  if(document.getElementById('tc-act')) document.getElementById('tc-act').textContent = activeBets.length;
  if(document.getElementById('tc-won')) document.getElementById('tc-won').textContent = wonBets.length;
  if(document.getElementById('tc-lst')) document.getElementById('tc-lst').textContent = allBets.filter(b => b.status === 'lost').length;

  renderBets(allBets);
}

function renderBets(list) {
  const container = document.getElementById('bet-list'); // Correct ID
  if (!container) return;
  
  if (!list || list.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-ico">📦</div>You don\'t have any bets yet</div>';
    return;
  }

  container.innerHTML = list.map(bet => {
    const payout = Math.round(bet.amount * (100/bet.pct));
    const isWon = bet.status === 'won';
    const isLost = bet.status === 'lost';

    return `
      <div class="bet-row">
        <div class="br-status ${bet.status}"></div>
        <div class="br-info">
          <div class="br-title">${bet.title}</div>
          <div class="br-meta">
            <span class="br-outcome">Prediction: <strong>${bet.outcome}</strong></span>
            <span class="br-date">Multiplier: ×${(100/bet.pct).toFixed(2)}</span>
          </div>
        </div>
        <div class="br-amounts">
          <span class="br-amt">₡${bet.amount.toLocaleString()}</span>
          <span class="br-pot ${isWon ? 'green' : (isLost ? 'red' : '')}">
            ${bet.status === 'active' ? 'Possible payout: ₡' + payout.toLocaleString() : (isWon ? '+ ₡' + payout.toLocaleString() : '- ₡' + bet.amount.toLocaleString())}
          </span>
        </div>
        <div class="br-badge">
          <span class="badge ${bet.status}">${bet.status === 'active' ? 'Active' : (isWon ? 'Win' : 'Loss')}</span>
        </div>
      </div>
    `;
  }).join('');
}

function showTab(type, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  if (type === 'all') renderBets(allBets);
  else renderBets(allBets.filter(b => b.status === type));
}

document.addEventListener('DOMContentLoaded', loadMyBets);
</script>
</body>
</html>
