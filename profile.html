async function loadProfile() {
  const balance = await SHARED.getBalance();
  const bets = await SHARED.getBets();
  
  const balNum = document.getElementById('bal-num');
  if(balNum) balNum.textContent = balance.toLocaleString();

  if(document.getElementById('p-bal')) {
    document.getElementById('p-bal').textContent = '₡' + balance.toLocaleString();
  }
  
  if(document.getElementById('p-bets')) {
    document.getElementById('p-bets').textContent = bets.length;
  }
  
  if(document.getElementById('p-winrate')) {
    const finished = bets.filter(b => b.status !== 'active');
    if (finished.length > 0) {
      const won = finished.filter(b => b.status === 'won').length;
      const rate = Math.round((won / finished.length) * 100);
      document.getElementById('p-winrate').textContent = rate + '%';
    } else {
      document.getElementById('p-winrate').textContent = '0%';
    }
  }

  const profile = await SHARED.getProfile();
  if (document.getElementById('prof-name')) {
      document.getElementById('prof-name').textContent = profile.username || 'Player';
  }
}

async function changeName() {
    const newName = prompt("Enter new name (max 15 characters):");
    if (newName && newName.trim().length > 0) {
        await SHARED.updateUsername(newName.trim().substring(0, 15));
        location.reload(); // Reload to refresh
    }
}

document.addEventListener('DOMContentLoaded', loadProfile);
